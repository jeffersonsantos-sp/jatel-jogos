<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JATEL-GAMES - Stop Biblico</title>
  <link rel="icon" href="images/fevicon.png" type="image/png">
  <link rel="stylesheet" href="css/game-shared.css">
  <link rel="stylesheet" href="stop_biblico/styles.css">
</head>
<body>
  <header class="game-header">
    <h1>Stop Biblico</h1>
    <nav>
      <a href="index.html">Home</a>
    </nav>
  </header>

  <main class="game-content">
    <h4>Escolha a Letra</h4>
    <button class="btn btn-primary" onclick="escolherLetraAleatoria()">UUUUUU SSSSSTOP</button>

    <div id="alphabet"></div>

    <h3>Cronometro</h3>
    <div class="timer-section">
      <label for="minutos">Definir minutos:</label>
      <input type="number" id="minutos" value="1" min="1">
      <button onclick="iniciarCronometro()">Iniciar Cronometro</button>
      <div id="cronometro"><span id="tempoRestante">00:00</span></div>
    </div>

    <h2>Categorias</h2>
    <div class="categories">
      <div class="category">
        <label for="nome">Qualidade de Jeova:</label>
        <input type="text" id="nome" autocomplete="off">
        <label for="pontuacaoNome">Ponto:</label>
        <input type="number" id="pontuacaoNome" value="0" min="0">
      </div>
      <div class="category">
        <label for="frutas">Nome Biblico:</label>
        <input type="text" id="frutas" autocomplete="off">
        <label for="pontuacaoFrutas">Ponto:</label>
        <input type="number" id="pontuacaoFrutas" value="0" min="0">
      </div>
      <div class="category">
        <label for="animal">Animal citado na Biblia:</label>
        <input type="text" id="animal" autocomplete="off">
        <label for="pontuacaoAnimal">Ponto:</label>
        <input type="number" id="pontuacaoAnimal" value="0" min="0">
      </div>
      <div class="category">
        <label for="objetos">Objeto Biblico:</label>
        <input type="text" id="objetos" autocomplete="off">
        <label for="pontuacaoObjetos">Ponto:</label>
        <input type="number" id="pontuacaoObjetos" value="0" min="0">
      </div>
      <div class="category">
        <label for="cidade">Cidade ou Local Biblico:</label>
        <input type="text" id="cidade" autocomplete="off">
        <label for="pontuacaoCidade">Ponto:</label>
        <input type="number" id="pontuacaoCidade" value="0" min="0">
      </div>
      <div class="category">
        <label for="filmes">Livros da Biblia:</label>
        <input type="text" id="filmes" autocomplete="off">
        <label for="pontuacaoFilmes">Ponto:</label>
        <input type="number" id="pontuacaoFilmes" value="0" min="0">
      </div>
      <div class="category">
        <label for="jw">Qualidade Crista:</label>
        <input type="text" id="jw" autocomplete="off">
        <label for="pontuacaoJw">Ponto:</label>
        <input type="number" id="pontuacaoJw" value="0" min="0">
      </div>
      <div class="category">
        <label for="biblia">N.H.N.M:</label>
        <input type="text" id="biblia" autocomplete="off">
        <label for="pontuacaoBiblia">Ponto:</label>
        <input type="number" id="pontuacaoBiblia" value="0" min="0">
      </div>
    </div>

    <div class="score-actions">
      <button class="btn btn-primary" onclick="calcularTotal()">Salvar Total da Rodada</button>
      <button class="btn btn-outline" onclick="limparCampos()">Limpar</button>
    </div>

    <div id="totalRodada">
      Total da rodada: <span id="totalValorRodada">0</span>
    </div>

    <div id="historicoRodadas">
      <h2>Historico de Rodadas</h2>
      <ul id="listaRodadas"></ul>
    </div>

    <div id="totalGeral">
      Total Geral: <span id="totalValorGeral">0</span>
    </div>
  </main>

  <footer class="game-footer">
    <p>JATEL-GAMES &copy; 2026. Todos os direitos reservados.</p>
  </footer>

  <script src="stop_biblico/script.js"></script>
</body>
</html>
