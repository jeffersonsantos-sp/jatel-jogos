<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JATEL-GAMES - Jogo da Memória</title>
  <link rel="icon" href="images/fevicon.png" type="image/png">

  <link rel="stylesheet" href="css/game-shared.css">
  <style>
    /* ============================================
       Jogo da Memória - Game Specific Styles
       ============================================ */

    .memory-game {
      flex: 1;
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: var(--space-lg);
      padding: var(--space-lg);
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
      min-height: calc(100vh - 140px);
    }

    /* Sidebar */
    .game-sidebar {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: var(--space-xl) var(--space-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-xl);
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 80px;
      height: fit-content;
    }

    .game-sidebar .score-display {
      text-align: center;
    }

    .game-sidebar .score-label {
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: var(--space-xs);
    }

    .game-sidebar .score-value {
      font-size: var(--font-size-3xl);
      font-weight: 700;
      color: var(--color-primary);
      line-height: 1;
    }

    .game-sidebar .btn-restart {
      width: 100%;
      padding: var(--space-md) var(--space-lg);
      background: var(--color-primary);
      color: white;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: var(--font-size-base);
      transition: all var(--transition-fast);
    }

    .game-sidebar .btn-restart:hover {
      background: var(--color-primary-dark);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    /* Card Grid */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-md);
      align-content: start;
    }

    .card {
      aspect-ratio: 1;
      perspective: 1000px;
      cursor: pointer;
      user-select: none;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-front {
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      transform: rotateY(180deg);
    }

    .card-front img {
      width: 80%;
      height: 80%;
      object-fit: contain;
      border-radius: var(--radius-sm);
    }

    .card-back {
      background: linear-gradient(135deg, var(--color-accent), var(--color-accent-dark));
      box-shadow: var(--shadow-sm);
    }

    .card-back::after {
      content: '?';
      font-size: var(--font-size-3xl);
      font-weight: 700;
      color: rgba(255, 255, 255, 0.9);
    }

    .card:hover .card-inner {
      transform: scale(1.03);
    }

    .card.flipped:hover .card-inner {
      transform: rotateY(180deg) scale(1.03);
    }

    /* Match animation */
    .card.matched .card-inner {
      animation: matchPulse 0.5s ease;
    }

    .card.matched .card-front {
      box-shadow: 0 0 20px rgba(26, 107, 90, 0.5);
    }

    @keyframes matchPulse {
      0%, 100% { transform: rotateY(180deg) scale(1); }
      50% { transform: rotateY(180deg) scale(1.08); }
    }

    /* Mismatch animation */
    .card.mismatched .card-inner {
      animation: mismatchShake 0.4s ease;
    }

    @keyframes mismatchShake {
      0%, 100% { transform: rotateY(180deg) translateX(0); }
      20%, 60% { transform: rotateY(180deg) translateX(-5px); }
      40%, 80% { transform: rotateY(180deg) translateX(5px); }
    }

    .card.mismatched .card-front {
      box-shadow: 0 0 15px rgba(220, 53, 69, 0.4);
    }

    /* Disabled cards */
    .card.disabled {
      pointer-events: none;
      opacity: 0.7;
    }

    /* Victory Overlay */
    .victory-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      backdrop-filter: blur(8px);
      animation: fadeIn 0.3s ease;
    }

    .victory-overlay.active {
      display: flex;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .victory-card {
      background: var(--color-surface);
      border-radius: var(--radius-xl);
      padding: var(--space-3xl) var(--space-2xl);
      text-align: center;
      max-width: 450px;
      width: 90%;
      box-shadow: var(--shadow-xl);
      animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .victory-card .trophy {
      font-size: 4rem;
      margin-bottom: var(--space-lg);
    }

    .victory-card h2 {
      font-size: var(--font-size-2xl);
      color: var(--color-primary);
      margin-bottom: var(--space-sm);
    }

    .victory-card .victory-message {
      color: var(--color-text-muted);
      margin-bottom: var(--space-lg);
    }

    .victory-card .victory-score {
      font-size: var(--font-size-xl);
      font-weight: 700;
      color: var(--color-accent);
      margin-bottom: var(--space-xl);
    }

    .victory-card .btn-play-again {
      display: inline-flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-md) var(--space-2xl);
      background: var(--color-primary);
      color: white;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: var(--font-size-base);
      text-decoration: none;
      transition: all var(--transition-fast);
    }

    .victory-card .btn-play-again:hover {
      background: var(--color-primary-dark);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      color: white;
    }

    /* Mobile Score Bar */
    .mobile-score-bar {
      display: none;
      position: sticky;
      top: 56px;
      z-index: 50;
      background: var(--color-surface);
      padding: var(--space-sm) var(--space-md);
      border-bottom: 1px solid var(--color-border);
      align-items: center;
      justify-content: space-between;
    }

    .mobile-score-bar .score-text {
      font-weight: 600;
      color: var(--color-text);
    }

    .mobile-score-bar .score-text span {
      background: var(--color-primary);
      color: white;
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--radius-sm);
      margin-left: var(--space-xs);
    }

    /* ============================================
       Responsive
       ============================================ */

    @media (max-width: 900px) {
      .memory-game {
        grid-template-columns: 1fr;
        padding: var(--space-md);
      }

      .game-sidebar {
        display: none;
      }

      .mobile-score-bar {
        display: flex;
      }

      .card-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: var(--space-sm);
      }
    }

    @media (max-width: 600px) {
      .memory-game {
        padding: var(--space-sm);
      }

      .card-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: var(--space-xs);
      }

      .card-back::after {
        font-size: var(--font-size-xl);
      }

      .card-front img {
        width: 70%;
        height: 70%;
      }
    }

    @media (max-width: 400px) {
      .card-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (min-height: 800px) {
      .card {
        aspect-ratio: auto;
        height: 180px;
      }
    }

    /* Dark mode adjustments */
    body.dark-mode .card-back {
      background: linear-gradient(135deg, var(--color-surface), var(--color-bg-alt));
    }

    body.dark-mode .card-front {
      background: linear-gradient(135deg, var(--color-primary-dark), var(--color-primary));
    }
  </style>
